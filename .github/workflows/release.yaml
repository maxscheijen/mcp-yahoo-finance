name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-yahoo-finance
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Restrict releases to repository owner
        env:
          RELEASE_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          if [[ "${RELEASE_ACTOR,,}" != "maxscheijen" ]]; then
            echo "Only maxscheijen can publish a release (triggered by ${RELEASE_ACTOR})."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          project_version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          tag_version="${RELEASE_TAG#v}"

          if [[ "$project_version" != "$tag_version" ]]; then
            echo "Tag ${RELEASE_TAG} does not match project version ${project_version}."
            exit 1
          fi

      - name: Run tests
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
