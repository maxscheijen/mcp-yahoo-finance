name: Release

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mcp-yahoo-finance
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Restrict releases to repository owner
        env:
          RELEASE_ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          if [[ "${RELEASE_ACTOR,,}" != "maxscheijen" ]]; then
            echo "Only maxscheijen can publish a release (triggered by ${RELEASE_ACTOR})."
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Check release version
        id: release_version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          project_version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          previous_version="$(git show "${BEFORE_SHA}:pyproject.toml" 2>/dev/null | uv run --no-project python -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])' || true)"

          if [[ -z "$previous_version" || "$project_version" == "$previous_version" ]]; then
            echo "pyproject.toml must change the project version to publish a release."
            exit 1
          fi

          echo "version=$project_version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Check distributions
        run: uvx twine check dist/*

      - name: Create matching release tag
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        shell: bash
        run: |
          tag="v${RELEASE_VERSION}"

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag ${tag} already exists on a different commit."
              exit 1
            fi
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
